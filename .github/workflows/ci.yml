name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # wxPython has no Linux wheels on PyPI for the 4.3.x series; Linux
        # builds currently try to compile wxWidgets from source. Keep Linux
        # out of the default matrix until there is a wheel strategy.
        os: [macos-latest, windows-latest]
        python: ["3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}

      - name: Sync dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run python -m pytest tests/ -q

      - name: Build docs
        run: uv run mkdocs build

      - name: Build package
        run: uv build
